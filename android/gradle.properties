# Heap sized for a 16GB machine, not against it.
#
# This was -Xmx8G with a 4G metaspace: up to 12GB reserved for Gradle alone,
# on a machine with 16GB total that also runs the IDE, a browser and an
# emulator. That is where the swapping came from, and a swapping build is a
# slow build. 4G is comfortably above what this project's largest module
# needs, and leaves the OS enough to avoid paging the compiler out.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# 8 cores, so build the independent plugin modules at the same time. This
# project pulls in a long tail of Flutter plugins (firebase, mlkit, webrtc,
# maps, video), and serially they dominate the wall clock.
org.gradle.parallel=true

# Reuse task outputs across builds and across clean builds. Without this every
# build recompiled work it had already done.
org.gradle.caching=true

org.gradle.daemon=true

android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Kotlin compiles in its own daemon again.
#
# This used to be pinned to `in-process` to dodge an AccessDeniedException
# writing kotlin-daemon marker files under %LOCALAPPDATA% — a Windows path.
# On macOS that workaround bought nothing and cost a great deal: in-process
# compilation runs inside the Gradle daemon's heap, competes with it, and
# gives up most of Kotlin's incremental compilation. This module has ~18k
# lines of Kotlin in ar_camera alone, so it was the single largest chunk of
# the build. `useFallbackStrategy` below still drops back to in-process if the
# daemon genuinely cannot start, so the Windows case remains covered.
kotlin.compiler.execution.strategy=daemon
kotlin.daemon.useFallbackStrategy=true
kotlin.daemon.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m
kotlin.incremental=true
